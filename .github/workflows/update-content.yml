name: Update content feed

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install thumbnail analysis dependency
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Refresh feed (YouTube + TikTok) and regenerate sections
        env:
          ENSEMBLE_API_KEY: ${{ secrets.ENSEMBLE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-feed.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "pbn-content-bot"
          git config user.email "bot@palebluenexus.com"
          git add data/feed.json data/guests.json data/attribution-cache.json index.html book/index.html partner/index.html episodes images/feed images/promo share/guest sitemap.xml sitemap-video.xml robots.txt llms.txt .well-known/agent-card.json transcripts data/insights
          for guest_image in images/guest-*.jpg images/guest-*.svg; do
            [ -e "$guest_image" ] && git add "$guest_image"
          done
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore(content): auto-update feed, guests showcase & promo pages"
            git push
          fi
