  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #04060e;
      --bg-card: rgba(255,255,255,0.03);
      --bg-card-hover: rgba(255,255,255,0.06);
      --border-subtle: rgba(255,255,255,0.06);
      --border-accent: rgba(212,168,75,0.5);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(166,210,230,1);
      --text-muted: rgba(146,196,222,0.7);
      --accent-blue: #7EB8DA;
      --accent-warm: #D4A84B;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-deep); color: var(--text-primary); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.25rem 2.5rem; display: flex; align-items: center; justify-content: space-between; }
    nav.scrolled { background: rgba(4,6,14,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-subtle); }
    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo img { height: 40px; }
    .nav-links { display: flex; align-items: center; gap: 2.25rem; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 400; letter-spacing: 0.04em; transition: color 0.3s; }
    .nav-links a:hover { color: var(--text-primary); }
    .section-container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 7rem 2rem; }
    .page-hero { min-height: 40vh; display: flex; align-items: flex-end; padding: 8rem 0 3rem; }
    .section-eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-warm); display: block; margin-bottom: 1rem; }
    .section-heading { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 600; line-height: 1.15; margin-bottom: 1rem; }
    .section-subheading { color: var(--text-secondary); max-width: 680px; }
    .guest-dir-controls { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
    .guest-dir-controls input, .guest-dir-controls select { min-height: 2.8rem; border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--bg-card); color: var(--text-primary); font: inherit; padding: .65rem .8rem; }
    .guest-dir-controls input { flex: 1 1 280px; }
    .guest-dir-controls select { flex: 0 1 170px; }
    .guest-dir-controls input::placeholder { color: var(--text-muted); }
    .guest-dir-controls input:focus, .guest-dir-controls select:focus { outline: none; border-color: var(--accent-warm); box-shadow: 0 0 0 2px rgba(212,168,75,.15); }
    .guest-dir-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 1.5rem; margin-top: 2rem; }
    .guest-show-card { display: flex; gap: 1.1rem; align-items: stretch; text-decoration: none; color: inherit; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 1.1rem; transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease; }
    .guest-show-card:hover { background: var(--bg-card-hover); border-color: var(--border-accent); transform: translateY(-3px); }
    .guest-show-photo { flex: 0 0 84px; }
    .guest-show-photo img { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border-accent); }
    .guest-show-body { display: flex; flex-direction: column; min-width: 0; }
    .guest-show-tag { font-family: 'Inter', sans-serif; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-warm); }
    .guest-show-name { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.35rem; font-weight: 600; margin-top: 0.15rem; }
    .guest-show-role { font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--accent-blue); margin-top: 0.1rem; }
    .guest-show-quote { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 0.98rem; color: var(--text-secondary); margin-top: 0.5rem; line-height: 1.35; }
    .guest-show-promo { font-family: 'Inter', sans-serif; font-size: 0.78rem; color: var(--accent-warm); margin-top: auto; padding-top: 0.6rem; }
    #guest-empty { color: var(--text-secondary); margin-top: 2rem; }
    footer { padding: 3rem 2rem; text-align: center; border-top: 1px solid var(--border-subtle); }
    footer p { color: var(--text-muted); font-size: 0.85rem; }
    @media (max-width: 760px) { .nav-links { gap: 1rem; } .guest-dir-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav id="nav">
    <a href="/" class="nav-logo"><img src="../images/pbn-logo.png" alt="Pale Blue Nexus" /></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/episodes/">Episodes</a></li>
      <li><a href="/guests/">Guests</a></li>
      <li><a href="/book/">Be a Guest</a></li>
    </ul>
  </nav>

  <main>
    <section class="page-hero">
      <div class="section-container">
        <span class="section-eyebrow">Guests</span>

        <div class="guest-dir-controls">
          <input id="guest-search" type="search" placeholder="Search guests…" aria-label="Search guests" />
          <select id="guest-field" aria-label="Search field">
            <option value="all">All</option>

    <section style="padding-top:1rem">

      </div>
    </section>
  </main>

  <footer><p>Pale Blue Nexus. Making sense of the future, from right here.</p></footer>

  <script>
    const guests = JSON.parse(document.getElementById("pbn-guests").textContent || "[]");
    const grid = document.getElementById("guest-grid");
    const sentinel = document.getElementById("guest-sentinel");
    const empty = document.getElementById("guest-empty");
    const search = document.getElementById("guest-search");
    const field = document.getElementById("guest-field");
    const batchSize = 12;
    let matchesList = guests;
    let rendered = 0;

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[character]));
    }

    function matches(guest, query, selectedField) {
      if (!query) return true;
      const haystack = selectedField === "first" ? guest.first
        : selectedField === "last" ? guest.last
        : selectedField === "company" ? `${guest.company || ""} ${guest.role || ""}`
        : `${guest.name || ""} ${guest.role || ""} ${guest.company || ""}`;
      return String(haystack || "").toLowerCase().includes(query);
    }

    function cardHtml(guest) {
      const tag = [guest.episode, guest.stat].filter(Boolean).join(" · ");
      return `<a class="guest-show-card" href="${escapeHtml(guest.href)}">
        <div class="guest-show-photo"><img src="${escapeHtml(guest.photo)}" alt="${escapeHtml(guest.name)}" loading="lazy" /></div>
        <div class="guest-show-body">
          <span class="guest-show-tag">${escapeHtml(tag)}</span>
          <p class="guest-show-name">${escapeHtml(guest.name)}</p>
          <p class="guest-show-role">${escapeHtml(guest.role)}</p>
          ${guest.quote ? `<p class="guest-show-quote">&ldquo;${escapeHtml(guest.quote)}&rdquo;</p>` : ""}
          <span class="guest-show-promo">Promo kit &rarr;</span>
        </div>
      </a>`;
    }

    function renderMore() {
      const next = matchesList.slice(rendered, rendered + batchSize);
      if (next.length) {
        grid.insertAdjacentHTML("beforeend", next.map(cardHtml).join(""));
        rendered += next.length;
      }
      empty.hidden = matchesList.length !== 0;
    }

    function fill() {
      renderMore();
      while (rendered < matchesList.length && sentinel.getBoundingClientRect().top < window.innerHeight) {
        renderMore();
      }
    }

    function reset() {
      const query = search.value.trim().toLowerCase();
      matchesList = guests.filter((guest) => matches(guest, query, field.value));
      rendered = 0;
      grid.innerHTML = "";
      fill();
    }

    new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && rendered < matchesList.length) fill();
    }).observe(sentinel);
    search.addEventListener("input", reset);
    field.addEventListener("change", reset);
    reset();
    window.addEventListener("scroll", () => nav.classList.toggle("scrolled", window.scrollY > 50));
  </script>
</body>
</html>
